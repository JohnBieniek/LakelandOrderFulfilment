name: Deploy Azure

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to container registry
        run: az acr login --name "$REGISTRY"

      - name: Build and push image
        run: |
          set -euo pipefail
          image="$REGISTRY.azurecr.io/lakeland-api:$IMAGE_TAG"
          docker build --file Dockerfile --tag "$image" .
          docker push "$image"

      - name: Deploy image
        run: |
          set -euo pipefail
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --image "$REGISTRY.azurecr.io/lakeland-api:$IMAGE_TAG" \
            --set-env-vars Database__ApplyMigrations=true \
            --output none

      - name: Verify health endpoint
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            fqdn=$(az containerapp show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)
            curl --fail --retry 12 --retry-delay 10 --retry-all-errors "https://$fqdn/health"
