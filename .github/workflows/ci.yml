name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LakelandOrderFulfilment.slnx

      - name: Restore local tools
        run: dotnet tool restore

      - name: Audit dependencies
        run: dotnet list LakelandOrderFulfilment.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build LakelandOrderFulfilment.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test LakelandOrderFulfilment.slnx --configuration Release --no-build --verbosity normal

      - name: Verify database model has a migration
        run: >-
          dotnet tool run dotnet-ef migrations has-pending-model-changes
          --project src/Lakeland.OrderFulfilment.Api/Lakeland.OrderFulfilment.Api.csproj
          --startup-project src/Lakeland.OrderFulfilment.Api/Lakeland.OrderFulfilment.Api.csproj
          --configuration Release
          --no-build

      - name: Set up Node for browser tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test the storefront in Chromium
        run: npm run test:e2e

      - name: Test contact delivery validation
        run: npm run test:contact

      - name: Test payment validation and sandbox order ledger
        run: npm run test:payments

      - name: Test private Printful mug ordering tool
        run: npm run test:printful

      - name: Build and type-check Cloudflare beta
        run: |
          npm run build:cloudflare
          npm run check:cloudflare
          npx wrangler deploy --dry-run
          npx wrangler d1 migrations apply lakeland-payments-beta --local

      - name: Test the Cloudflare Worker in Chromium
        env:
          TEST_HOST: cloudflare
        run: npm run test:e2e

      - name: Save beta screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-browser-previews
          path: |
            artifacts/*.png
            test-results/

  deploy-beta:
    name: Deploy develop to Cloudflare
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.CLOUDFLARE_BETA_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: cloudflare-beta
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Publish the tested beta
        run: |
          npx wrangler d1 migrations apply lakeland-payments-beta --remote
          npm run deploy:cloudflare
      - name: Verify public beta
        run: |
          curl --fail --retry 6 --retry-delay 5 --retry-all-errors "https://lakeland-fine-arts-beta.johnbieniekgt.workers.dev/health"
          echo "Beta: https://lakeland-fine-arts-beta.johnbieniekgt.workers.dev" >> "$GITHUB_STEP_SUMMARY"
