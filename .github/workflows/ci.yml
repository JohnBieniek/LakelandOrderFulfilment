name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LakelandOrderFulfilment.slnx

      - name: Audit dependencies
        run: dotnet list LakelandOrderFulfilment.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build LakelandOrderFulfilment.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test LakelandOrderFulfilment.slnx --configuration Release --no-build --verbosity normal
